      <text x="137" y="437">Tasks</text>
      <text x="137" y="455">Test</text>
      <text x="137" y="473">Url</text>
    </g>
    <path d="M42 483 H217" fill="none" stroke="#d8c8aa"/>
    <text x="42" y="499" font-size="14" font-weight="650">Windows.Com</text>
  </g>

