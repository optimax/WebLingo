name: Build and test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      # Report every platform's result, rather than cancel the others when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The solution is in the repository's WebLingo/ folder.
        working-directory: WebLingo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WebLingo.slnx
      - run: dotnet build WebLingo.slnx --no-restore -c Release
      - run: dotnet test WebLingo.slnx --no-build -c Release
  # The installers for Linux on x64, made, then installed, run and removed, each way (Installers/Linux/readme.md).
  linux-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: bash Installers/Linux/package.sh --architecture x64 --destination "$RUNNER_TEMP/packages"
      - run: bash Installers/Linux/tests/test.sh "$RUNNER_TEMP/packages"
      # Examples.wasp/example1 served through nginx and Apache httpd, as the WASP User Manual's section 18 configures them.
      - run: bash Installers/Linux/tests/serve.sh "$RUNNER_TEMP/packages"
