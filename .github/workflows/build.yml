name: Build and test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      # Report every platform's result, rather than cancel the others when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The solution is in the repository's WebLingo/ folder.
        working-directory: WebLingo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WebLingo.slnx
      - run: dotnet build WebLingo.slnx --no-restore -c Release
      - run: dotnet test WebLingo.slnx --no-build -c Release
