name: Build and test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WebLingo.slnx
      - run: dotnet build WebLingo.slnx --no-restore -c Release
      - run: dotnet test WebLingo.slnx --no-build -c Release
